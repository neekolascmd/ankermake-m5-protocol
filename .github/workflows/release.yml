name: Release binaries

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "ankerctl.py"
      - "ankerctl.spec"
      - "requirements.txt"
      - "cli/**"
      - "libflagship/**"
      - "web/**"
      - "static/**"
      - "ssl/**"
      - "templates/**"
      - "specification/**"
      - "packaging/**"
      - "README.md"
      - "LICENSE"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYINSTALLER_VERSION: "6.21.0"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x86_64
            executable: release-dist/ankerctl.exe
            archive: ankerctl-windows-x86_64.zip
          - runner: macos-15-intel
            platform: macos-x86_64
            executable: release-dist/ankerctl
            archive: ankerctl-macos-x86_64.tar.gz
          - runner: macos-15
            platform: macos-arm64
            executable: release-dist/ankerctl
            archive: ankerctl-macos-arm64.tar.gz

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller==${PYINSTALLER_VERSION}"
          python -m pip check

      - name: Build executable
        shell: bash
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --distpath release-dist
          --workpath release-build
          ankerctl.spec

      - name: Smoke test executable
        shell: bash
        run: '"${{ matrix.executable }}" --help'

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item "${{ matrix.executable }}" package/ankerctl.exe
          Copy-Item LICENSE, README.md package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"

      - name: Package macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir package
          cp "${{ matrix.executable }}" LICENSE README.md package/
          tar -czf "${{ matrix.archive }}" -C package .

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --generate-notes \
              --title "ankerctl ${RELEASE_TAG}" \
              --verify-tag \
              --repo "${GITHUB_REPOSITORY}"
          fi
